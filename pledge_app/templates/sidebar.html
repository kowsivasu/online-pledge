<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoreUI Sidebar</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CoreUI CSS -->
  <link href="https://unpkg.com/@coreui/coreui@4.2.6/dist/css/coreui.min.css" rel="stylesheet">

  <!-- CoreUI Icons (IMPORTANT) -->
  <link href="https://unpkg.com/@coreui/icons/css/all.min.css" rel="stylesheet">

  
</head>

<body class="app">

<div class="wrapper d-flex">

  <!-- Sidebar -->
<div class="sidebar sidebar-dark sidebar-fixed bg-dark">
        <div class="sidebar-header border-bottom">
      <div class="sidebar-brand">CoreUI</div>
    </div>

    <ul class="sidebar-nav">
      <li class="nav-title">NAV TITLE</li>

      <li class="nav-item">
        <a class="nav-link active" href="#">
          <i class="nav-icon cil-speedometer"></i> Nav item
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" href="#">
          <i class="nav-icon cil-speedometer"></i> With badge
          <span class="badge bg-primary ms-auto">NEW</span>
        </a>
      </li>

      <li class="nav-item nav-group show">
        <a class="nav-link nav-group-toggle" href="#">
          <i class="nav-icon cil-puzzle"></i> Nav dropdown
        </a>
        <ul class="nav-group-items">
          <li class="nav-item">
            <a class="nav-link" href="#">

        </ul>
      </li>
    </ul>

    <div class="sidebar-footer border-top d-flex">

    </div>
  </div>

  <!-- Main Content -->
  <!-- Main Content -->
<div class="wrapper flex-grow-1">
  <div class="body flex-grow-1 px-3">
    <div class="container-lg">
      <h2>Dashboard Content Here</h2>

</div>
