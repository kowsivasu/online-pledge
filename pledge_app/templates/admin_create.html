{% load static %}
<!doctype html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="{% static 'pledge_app/css/style.css' %}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
     <link

      media="print"
      onload="this.media='all'"
    />
    <!--end::Fonts-->
    <!--begin::Third Party Plugin(OverlayScrollbars)-->

      rel="stylesheet"

    <title>Online Pledge</title>
  </head>

  
  <body>

    <aside class="sidebar">
      <div class="toggle">
        <a href="#" class="burger js-menu-toggle" data-toggle="collapse" data-target="#main-navbar">
              <span></span>
        </a>
      </div>
      <div class="side-inner">
        <div class="logo-wrap">
          <div class="logo">
            <span>OP</span>
          </div>
          <span class="logo-text">Online Pledge</span>
        </div>
          
        <div class="search-form">
          <form action="#">
            <span class="wrap-icon">
              <span class="icon-search2"></span>
            </span>
            <input type="text" class="form-control" placeholder="Search...">
          </form>
        </div>
        <div class="nav-menu">
          <ul>
          <li class="{% if request.resolver_match.url_name == 'admins' %}active{% endif %}">
          <a href="{% url 'admins' %}" class="d-flex align-items-center">
          <span class="wrap-icon icon-videocam mr-3"></span>
          <span class="menu-text">Admins</span>
          </a>
          </li>

          <li class="{% if request.resolver_match.url_name == 'backend_pledges' %}active{% endif %}">
          <a href="{% url 'backend_pledges' %}" class="d-flex align-items-center">
          <span class="wrap-icon icon-home2 mr-3"></span>
          <span class="menu-text">Backend Pledges</span>
          </a>
          </li>
          
          <li class="{% if request.resolver_match.url_name == 'pledges' %}active{% endif %}">
          <a href="{% url 'pledges' %}" class="d-flex align-items-center">
          <span class="wrap-icon icon-home2 mr-3"></span>
          <span class="menu-text">Pledge List</span>
          </a>
          </li>
            
          <li><a href="#" class="d-flex align-items-center"><span class="wrap-icon icon-book mr-3"></span><span class="menu-text">Books</span></a></li>
            
          <li><a href="#" class="d-flex align-items-center"><span class="wrap-icon icon-shopping-cart mr-3"></span><span class="menu-text">Store</span></a></li>
            
          <li><a href="#" class="d-flex align-items-center"><span class="wrap-icon icon-pie-chart mr-3"></span><span class="menu-text">Analytics</span></a></li>

          <li class="{% if request.resolver_match.url_name == 'profile_logout' %}active{% endif %}">
          <a href="{% url 'profile_logout' %}" class="d-flex align-items-center">
            <span class="wrap-icon icon-home2 mr-3"></span>
            <span class="menu-text">Logout</span>
          </a>
        </li>  
        </ul>
        </div>
      </div>
      
    </aside>
    <main>
  <div class="site-section">
    <div class="container">
      <div class="row">
        <div class="col-12">

          

          <!-- form start -->
            <div class="card card-primary card-outline mb-4">
                  <!--begin::Header-->
                  <div class="card-header"><div class="card-title">Admin Create</div></div>
                  <!--end::Header-->
                  <!--begin::Form-->
                  <form action="{% url 'admin_store' %}" method="POST">
                    {% csrf_token %}
                    
                    <!--begin::Body-->
                    <div class="card-body">

                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Name</label>
                                <input
                                type="text" name="username"
                                class="form-control"
                                id="exampleInputEmail1"
                                aria-describedby="emailHelp"
                                />
                        </div>

                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Email address</label>
                                <input
                                type="email" name="email"
                                class="form-control"
                                id="exampleInputEmail1"
                                aria-describedby="emailHelp"
                                />
                        </div>

                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Mobile</label>
                                <input
                                type="text" name="first_name"
                                class="form-control"
                                id="exampleInputEmail1"
                                aria-describedby="emailHelp"
                                />
                        </div>

                        <div class="mb-3">
                            <label for="exampleInputPassword1" name = "password" class="form-label">Password</label>
                            <input 
                                type="password" 
                                name="password"
                                class="form-control" 
                                id="exampleInputPassword1"
                                autocomplete="new-password"
                            />                        </div>

                    </div>
                    <!--end::Body-->
                    <!--begin::Footer-->
                    <div class="card-footer">
                      <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                    <!--end::Footer-->
                  </form>
                  <!--end::Form-->
                </div>
          <!-- form end -->

        </div>
      </div>
    </div>
  </div>
</main>
    

    <!-- jQuery FIRST -->
    <script src="{% static 'pledge_app/js/jquery-3.3.1.min.js' %}"></script>

    <!-- Bootstrap -->
    <script src="{% static 'pledge_app/js/popper.min.js' %}"></script>
    <script src="{% static 'pledge_app/js/bootstrap.min.js' %}"></script>

    <!-- DataTables AFTER jQuery -->
    <script src="{% static 'pledge_app/Datatables/datatables.min.js' %}"></script>

    <!-- Custom JS -->
    <script src="{% static 'pledge_app/js/main.js' %}"></script>

    <script>
    $(document).ready(function() {
        $('#myTable').DataTable();
    });
    </script>

    <script>
                    // Example starter JavaScript for disabling form submissions if there are invalid fields
                    (() => {
                      'use strict';

                      // Fetch all the forms we want to apply custom Bootstrap validation styles to
                      const forms = document.querySelectorAll('.needs-validation');

                      // Loop over them and prevent submission
                      Array.from(forms).forEach((form) => {
                        form.addEventListener(
                          'submit',
                          (event) => {
                            if (!form.checkValidity()) {
                              event.preventDefault();
                              event.stopPropagation();
                            }

                            form.classList.add('was-validated');
                          },
                          false,
                        );
                      });
                    })();
                  </script>

  </body>
</html>
