<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Environment Pledge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f7f5;
            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;

            padding: 20px 0;   /* 👈 add this line */
        }

        .box {
            background: white;
            width: 432px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
        }

        input {
            width: 300px;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid gray;
        }

        form {
            text-align: center;
            margin-top: 30px;
        }

        /* ✅ Creepy Button */
        .creepy-btn {
            position: relative;
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 0;
            margin-top: 30px;
        }

        .creepy-btn__cover {
            display: block;
            padding: 15px 45px;
            background: #1c4a1d;
            color: white;
            font-size: 16px;
            border-radius: 35px;
            font-weight: bold;
            border: 3px solid black;

            /* transform-origin: left center; */
            transition: 0.3s;
        }

        .creepy-btn:hover .creepy-btn__cover {
            transform: rotate(-12deg);
        }

        .creepy-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: black;
            border-radius: 35px;
            z-index: -1;
            transform: translateY(10px);
        }

        .creepy-btn__eyes {
            position: absolute;
            right: 20px;
            bottom: -18px;
            display: flex;
            gap: 8px;

            opacity: 0;
            transform: translateY(10px);
            transition: 0.3s ease;
        }

        .creepy-btn:hover .creepy-btn__eyes {
            opacity: 1;              /* 👀 visible */
            transform: translateY(0);
            
    
        }

        .creepy-btn__eye {
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            border: 2px solid black;
        }

        .creepy-btn__pupil {
            width: 7px;
            height: 7px;
            background: black;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .pledge-form {
            width: 100%;
        }

        .form-row {
            display: flex;
            align-items: center;
            gap: 15px;
            /* justify-content: space-between; */
            margin-bottom: 10px;
        }
        .input-wrapper {
            display: flex;
            flex-direction: column;
        }

        .error-message {
            color: red;
            font-size: 14px;
            min-height: 18px;   /* prevents layout jump */
            margin-top: 4px;
        }
        .form-row label {
            /* width: 150px; */
            /* text-align: left; */
            min-width: 120px;
            font-weight: bold;
        }

        .form-row input,
        .form-row select {
            width: 275px;
            padding: 10px;
            border-radius: 25px;
            border: 1px solid gray;
            
        }

        .custom-check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
}

.custom-check input[type="checkbox"] {
    width: 16px;
    height: 16px;
}
    </style>
</head>

                    </span>
                    <span class="creepy-btn__eye">
                        <span class="creepy-btn__pupil"></span>
                    </span>
                </span>
                <span class="creepy-btn__cover">I Pledge</span>

    </div>

    <!-- ✅ JavaScript Eye Movement -->

    <script>
        const button = document.querySelector(".creepy-btn");
        const pupils = document.querySelectorAll(".creepy-btn__pupil");

        button.addEventListener("mousemove", function (e) {
            const rect = button.getBoundingClientRect();

            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const moveX = (x - rect.width / 2) / 15;
            const moveY = (y - rect.height / 2) / 15;

            pupils.forEach(pupil => {
                pupil.style.transform =
                    `translate(-50%, -50%) translate(${moveX}px, ${moveY}px)`;
            });
        });

        button.addEventListener("mouseleave", function () {
            pupils.forEach(pupil => {
                pupil.style.transform = "translate(-50%, -50%)";
            });
        });

        button.addEventListener("mouseenter", () => {
            button.querySelector(".creepy-btn__eyes").style.opacity = "1";
        });

        button.addEventListener("mouseleave", () => {
            button.querySelector(".creepy-btn__eyes").style.opacity = "0";
        });

    </script>
    <!-- name error -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

    const form = document.querySelector("form");
    const nameInput = document.getElementById("name");
    const nameError = document.getElementById("nameError");
            function isValidName(value) {
            const pattern = /^[A-Za-z\s]+$/;
            return pattern.test(value);
        }
    // ✅ Validate when leaving the field
    nameInput.addEventListener("blur", function () {
    const namelValue = nameInput.value.trim();

        // alert(namelValue)
        if (namelValue === "") {
            nameError.textContent = "Name is required.";
        }
        else if (!isValidName(namelValue)) {
                nameError.textContent = "Name must contain only letters.";
            }
        else if (nameInput.value.trim().length < 3) {
            nameError.textContent = "Name must be at least 3 characters long.";
        } else {
            nameError.textContent = "";
        }
    });

    // ✅ Also validate on submit (extra safety)
    form.addEventListener("submit", function (event) {
        if (nameInput.value.trim().length < 3) {
            event.preventDefault();
            nameError.textContent = "Name must be at least 3 characters long.";
        }
    });

    });
    </script>
    <!-- email error -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

        const form = document.querySelector("form");
        const emailInput = document.getElementById("email");
        const emailError = document.getElementById("emailError");

        // Email regex pattern
        function isValidEmail(email) {
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailPattern.test(email);
        }

        // ✅ Validate on blur (when leaving field)
        emailInput.addEventListener("blur", function () {
            const emailValue = emailInput.value.trim();

            if (emailValue === "") {
                emailError.textContent = "Email is required.";
            } 
            else if (!isValidEmail(emailValue)) {
                emailError.textContent = "Enter a valid email address.";
            } 
            else {
                emailError.textContent = "";
            }
        });

        // ✅ Validate on submit
        form.addEventListener("submit", function (event) {
            const emailValue = emailInput.value.trim();

            if (emailValue === "" || !isValidEmail(emailValue)) {
                event.preventDefault();
                emailError.textContent = "Enter a valid email address.";
            }
        });

    });
    </script>
